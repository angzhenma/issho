pluginManagement {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://storage.googleapis.com/download.flutter.io'
        }
        gradlePluginPortal()
    }

    def flutterSdkPath = new File(settingsDir, "local.properties").withInputStream {
        def props = new Properties()
        props.load(it)
        return props.getProperty("flutter.sdk")
    }

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
}

include ":app"

def flutterRoot = rootDir.getAbsoluteFile().getParentFile().getParentFile()
def pluginDepsFile = new File(flutterRoot, ".flutter-plugins-dependencies")
if (pluginDepsFile.exists()) {
    apply from: pluginDepsFile
}
